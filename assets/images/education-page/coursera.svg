<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Coursera">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00308f"/>
      <stop offset="1" stop-color="#0056d2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#cg)"/>
  <!-- The mark was a stroked arc, so it had no font at all. It is now a real
       glyph: Calibri where available, then CMU Sans Serif, then system sans.
       Size was set by measuring rendered ink, not by guessing: the old arc was
       111px tall, and font-size 127 renders an 82px cap, i.e. 26% smaller.
       The baseline sits at 146 so the letter centres on y=104, matching where
       every other card puts its motif. -->
  <text x="200" y="146" font-family="Calibri, 'CMU Sans Serif', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="127" fill="#ffffff" fill-opacity="0.95" text-anchor="middle">C</text>
  <text x="200" y="188" font-family="Georgia, serif" font-size="34" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="2">COURSERA</text>
  <text x="200" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13"
        fill="#ffffff" fill-opacity="0.75" text-anchor="middle" letter-spacing="1">ONLINE COURSE</text>
</svg>
